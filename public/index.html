<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bnet TV Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#202b3c}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:#142238;color:white;padding:25px 18px}
.logo{font-size:22px;font-weight:bold;margin-bottom:40px}
.menu{padding:13px;margin:8px 0;border-radius:8px;color:#cbd5e1}
.menu.active{background:#24446b;color:white}
.main{flex:1;padding:30px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
h1{font-size:26px;margin:0}
.muted{color:#78869a;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:25px}
.card,.panel{background:white;border-radius:12px;padding:22px;box-shadow:0 2px 10px #1522380a}
.number{font-size:30px;font-weight:bold;margin-top:12px}
.panel{overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:15px;min-width:550px}
th,td{text-align:left;padding:15px;border-bottom:1px solid #edf0f4;font-size:14px}
th{color:#78869a}
.status{color:#b7791f;background:#fff4d6;padding:6px 10px;border-radius:20px;font-size:12px}
button{background:#1769aa;color:white;border:0;padding:10px 16px;border-radius:7px;cursor:pointer}
@media(max-width:700px){
.sidebar{width:65px;padding:15px 8px}
.logo{font-size:12px;overflow:hidden}
.menu{font-size:11px;padding:10px 3px}
.main{padding:18px}
.cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">BNET TV</div>
<div class="menu active">Dashboard</div>
<div class="menu">Devices</div>
<div class="menu">Applications</div>
<div class="menu">Users</div>
<div class="menu">Activity Logs</div>
</aside>

<main class="main">
<header>
<div>
<h1>Dashboard</h1>
<p class="muted">Android TV Management System</p>
</div>
<button onclick="location.reload()">Refresh</button>
</header>

<section class="cards">
<div class="card">
<div class="muted">Total Devices</div>
<div class="number">0</div>
</div>
<div class="card">
<div class="muted">Online Devices</div>
<div class="number">0</div>
</div>
<div class="card">
<div class="muted">Offline Devices</div>
<div class="number">0</div>
</div>
</section>

<section class="panel">
<h3>Registered Devices</h3>
<p class="muted">Your Android TV devices will appear here.</p>
<table>
<thead>
<tr>
<th>Device Name</th>
<th>IP Address</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>No devices registered</td>
<td>—</td>
<td><span class="status">Waiting</span></td>
<td>—</td>
</tr>
</tbody>
</table>
</section>
</main>
</div>
</body>
</html>
